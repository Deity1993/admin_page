
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --panel: rgba(15, 23, 42, 0.78);
            --panel-strong: rgba(15, 23, 42, 0.92);
            --line: rgba(148, 163, 184, 0.2);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #14b8a6;
            --accent-soft: rgba(20, 184, 166, 0.18);
        }
        body {
            font-family: 'Manrope', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(45, 212, 191, 0.14), transparent 32%),
                radial-gradient(circle at bottom right, rgba(56, 189, 248, 0.12), transparent 32%),
                linear-gradient(180deg, #020617 0%, #0b1224 100%);
            color: var(--text);
            min-height: 100vh;
        }
        .code-font {
            font-family: 'IBM Plex Mono', monospace;
        }
        #root {
            min-height: 100vh;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.9);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.85);
            border-radius: 999px;
            border: 2px solid rgba(15, 23, 42, 0.85);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.85);
        }
    </style>
<script type="importmap">

  }
}

</head>
